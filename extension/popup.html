<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Fingerprint Spoofer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 380px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .main-content {
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
        }
        
        .toggle-section {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #4CAF50;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .toggle-label {
            display: block;
            margin-top: 10px;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-active {
            background-color: #4CAF50;
        }
        
        .status-inactive {
            background-color: #f44336;
        }
        
        .config-section {
            margin-bottom: 20px;
        }
        
        .config-section h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .config-select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            background: white;
        }
        
        .config-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }
        
        .privacy-levels {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        
        .privacy-option {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .privacy-option:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }
        
        .privacy-option.active {
            border-color: #667eea;
            background-color: #667eea;
            color: white;
        }
        
        .stats-section {
            background: rgba(102, 126, 234, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 11px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background-color: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #5a6fd8;
        }
        
        .btn-secondary {
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        
        .btn-secondary:hover {
            background-color: #d5dbdb;
        }
        
        .footer {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
            font-size: 12px;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.error {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ Fingerprint Spoofer</h1>
        <p>Protect your privacy from browser fingerprinting</p>
    </div>
    
    <div class="main-content">
        <div class="toggle-section">
            <label class="toggle-switch">
                <input type="checkbox" id="enableToggle">
                <span class="slider"></span>
            </label>
            <div class="toggle-label">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Loading...</span>
            </div>
        </div>
        
        <div class="config-section">
            <h3>Configuration Profile</h3>
            <select id="configSelect" class="config-select">
                <option value="windows_chrome">Windows Chrome</option>
                <option value="macos_safari">macOS Safari</option>
                <option value="linux_firefox">Linux Firefox</option>
                <option value="custom">Custom...</option>
            </select>
        </div>
        
        <div class="config-section">
            <h3>Privacy Level</h3>
            <div class="privacy-levels">
                <div class="privacy-option active" data-level="basic">Basic</div>
                <div class="privacy-option" data-level="standard">Standard</div>
                <div class="privacy-option" data-level="maximum">Maximum</div>
            </div>
        </div>
        
        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="sitesVisited">0</div>
                    <div class="stat-label">Sites Protected</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="sessionsProtected">0</div>
                    <div class="stat-label">Sessions</div>
                </div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-primary" id="testBtn">Test Protection</button>
            <button class="btn btn-secondary" id="optionsBtn">Options</button>
        </div>
    </div>
    
    <div class="footer">
        <a href="#" id="exportBtn">Export Settings</a> • 
        <a href="#" id="importBtn">Import Settings</a>
    </div>
    
    <div class="notification" id="notification"></div>
    
    <script src="popup.js"></script>
</body>
</html>
